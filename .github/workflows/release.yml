# ===================================
# API Monitor 完整发版流水线
# ===================================
# 触发条件：
# - 推送版本标签 (v*)
# - 自动或手动触发并指定版本号
#
# 流水线顺序（同组任务并行，无竞态）：
# 1. create-release + tests + Agent → 草稿、测试和各平台编译同时启动
# 2. upload-assets + Docker         → 运行时 Agent 完成后构建镜像，macOS 编译继续并行
# 3. merge-docker                   → 测试和双架构镜像均成功后合并 manifest
# 4. publish-release                → 附件和镜像完成后公开 Release
# 5. cleanup + scan                 → 并行清理临时镜像和安全扫描

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (如 1.0.0，不需要 v 前缀)"
        required: true
        type: string
      prerelease:
        description: "是否为预发布版本"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write
  security-events: write

env:
  GH_TOKEN: ${{ github.token }}
  IMAGE_NAME: api-monitor
  REGISTRY: ghcr.io
  DOCKERHUB_REPO: ${{ github.repository_owner }}/api-monitor

jobs:
  # ==========================================
  # Phase 1: 创建 GitHub Release
  # ==========================================
  create-release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          # A dispatch always releases the current main commit, even if a user
          # selects another branch in the workflow UI.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$REF_NAME"
            VERSION="${VERSION#v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}, Tag: v${VERSION}"

      - name: Verify source version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$RELEASE_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Release version ${RELEASE_VERSION} does not match package.json ${PACKAGE_VERSION}." >&2
            exit 1
          fi

      - name: Create or verify tag (dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            TAG_COMMIT=$(git rev-list -n 1 "$TAG")
            HEAD_COMMIT=$(git rev-parse HEAD)
            if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG already points to $TAG_COMMIT, not $HEAD_COMMIT." >&2
              exit 1
            fi
            echo "Tag $TAG already points to the current main commit; reusing it."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Generate changelog
        id: changelog
        env:
          CURRENT_TAG: ${{ steps.version.outputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          echo "## 🚀 $CURRENT_TAG 更新内容" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "### 📝 提交记录" >> release_notes.md
            echo "" >> release_notes.md

            echo "#### ✨ 新功能 (feat)" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^feat" >> release_notes.md || true
            echo "" >> release_notes.md

            echo "#### 🐛 修复 (fix)" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^fix" >> release_notes.md || true
            echo "" >> release_notes.md

            echo "#### 🔧 其他" >> release_notes.md
            git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^build\|^ci\|^chore\|^refactor\|^perf\|^style\|^test\|^docs" >> release_notes.md || true
            echo "" >> release_notes.md
          else
            echo "首次发布" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Docker 镜像" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull ghcr.io/$REPO_OWNER/api-monitor:${CURRENT_TAG#v}" >> release_notes.md
          echo "docker pull $REPO_OWNER/api-monitor:${CURRENT_TAG#v}" >> release_notes.md
          echo '```' >> release_notes.md

          echo "" >> release_notes.md
          echo "### 🖥️ Agent 下载" >> release_notes.md
          echo "| 平台 | 架构 | 文件 |" >> release_notes.md
          echo "|------|------|------|" >> release_notes.md
          echo "| Linux | amd64 | agent-linux-amd64 |" >> release_notes.md
          echo "| Linux | arm64 | agent-linux-arm64 |" >> release_notes.md
          echo "| Windows | amd64 | agent-windows-amd64.exe |" >> release_notes.md
          echo "| macOS | amd64 | agent-darwin-amd64 |" >> release_notes.md
          echo "| macOS | arm64 | agent-darwin-arm64 |" >> release_notes.md

          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Release ${{ steps.version.outputs.tag }}"
          body_path: release_notes.md
          draft: true
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}

  # ==========================================
  # Phase 2: Go 后端测试
  # ==========================================
  test-backend:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Go from backend-go/go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Run Go Tests
        working-directory: backend-go
        # -p 1 串行运行各包，避免后台 goroutine 并发持 TempDir 句柄导致清理竞态。
        run: go test ./... -v -p 1

      - name: Build Go Backend
        working-directory: backend-go
        run: go build -v -o api-monitor ./cmd/api-monitor

  # ==========================================
  # Phase 2: 前端测试
  # ==========================================
  test-frontend:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Disable pnpm enforcement
        run: echo "npm_config_user_agent=pnpm/9.0.0 npm/? node/?" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Three-side governance check
        run: npm run governance:check

      - name: Build Frontend Validation
        run: npm run build
        env:
          VITE_USE_CDN: false

  # ==========================================
  # Phase 3: 编译运行时 Rust Agent（Linux / Windows）
  # ==========================================
  build-agent-runtime:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            output_name: agent-linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            output_name: agent-linux-arm64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            output_name: agent-windows-amd64.exe
            use_cross: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: true
          cache-workspaces: agent-rust

      - name: Install musl-tools (Linux amd64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete
          sudo sed -i.bak '/packages\.microsoft\.com/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (ARM64 Linux)
        if: matrix.use_cross
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --force cross

      - name: Remove cargo mirror config in CI
        shell: bash
        run: rm -f agent-rust/.cargo/config.toml

      - name: Build Agent
        working-directory: agent-rust
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi

      - name: Copy & Rename Binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent.exe dist/${{ matrix.output_name }}
          else
            cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent dist/${{ matrix.output_name }}
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.sha256
          retention-days: 7

  # ==========================================
  # Phase 3b: 编译 macOS 下载 Agent
  # ==========================================
  build-agent-macos:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            output_name: agent-darwin-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            output_name: agent-darwin-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: true
          cache-workspaces: agent-rust

      - name: Remove cargo mirror config in CI
        shell: bash
        run: rm -f agent-rust/.cargo/config.toml

      - name: Build Agent
        working-directory: agent-rust
        shell: bash
        run: cargo build --target ${{ matrix.target }} --release

      - name: Copy & Rename Binary
        shell: bash
        run: |
          mkdir -p dist
          cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent dist/${{ matrix.output_name }}
          (cd dist && shasum -a 256 "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          ls -lh dist/

      - name: Upload agent artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.sha256
          retention-days: 7

  # ==========================================
  # Phase 4: 上传 Agent 到 Release
  # ==========================================
  # Phase 3c: 编译 api-monitor-relay（Go，三平台交叉编译）
  # ==========================================
  build-relay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: api-monitor-relay-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: api-monitor-relay-linux-arm64
          - goos: windows
            goarch: amd64
            output_name: api-monitor-relay-windows-amd64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Go from backend-go/go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Build Relay
        working-directory: backend-go
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o dist/${{ matrix.output_name }} ./cmd/api-monitor-relay
          (cd dist && sha256sum "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          ls -lh dist/

      - name: Upload relay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.sha256
          retention-days: 7

  # ==========================================
  upload-assets:
    needs: [create-release, build-agent-runtime, build-agent-macos, build-relay]
    runs-on: ubuntu-latest

    steps:
      - name: Download all agent & relay artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "agent-*, api-monitor-relay-*"
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Upload assets to Release
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          echo "📦 Uploading assets to release $TAG..."
          for file in artifacts/*; do
            FILENAME=$(basename "$file")
            echo "  ↗ Uploading $FILENAME..."
            gh release upload "$TAG" "$file" --repo "$REPO" --clobber
          done
          echo "✅ All assets uploaded."

  # ==========================================
  # Phase 5: 构建多架构 Docker 镜像
  # ==========================================
  build-docker:
    needs: [create-release, build-agent-runtime]
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Download compiled agent binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: agent-rust
          pattern: agent-*
          merge-multiple: true

      - name: List downloaded agents
        run: ls -lh agent-rust/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve application version
        id: app-version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=API Monitor
            org.opencontainers.image.description=API聚合监控面板
            org.opencontainers.image.vendor=iwvw
            maintainer=iwvw

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_REPO }}:build-${{ github.run_id }}-${{ matrix.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            NODE_ENV=production
            APP_VERSION=${{ steps.app-version.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  # ==========================================
  # Phase 6: 合并多架构 manifest
  # ==========================================
  merge-docker:
    needs: [test-backend, test-frontend, build-docker]
    runs-on: ubuntu-latest

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create and push manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)

          echo "AMD64 Digest: $AMD64_DIGEST"
          echo "ARM64 Digest: $ARM64_DIGEST"

          echo "$TAGS" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            # 确定 Registry 前缀，使用同源镜像合并（避免跨 Registry 400 错误）
            if [[ "$TAG" == "$REGISTRY"* ]]; then
               SRC_PREFIX="$REGISTRY/$REPO_OWNER/$IMAGE_NAME"
            else
               SRC_PREFIX="$DOCKERHUB_REPO"
            fi

            echo "🔗 Creating manifest: $TAG"

            for i in {1..3}; do
              docker buildx imagetools create -t "$TAG" \
                "${SRC_PREFIX}@${AMD64_DIGEST}" \
                "${SRC_PREFIX}@${ARM64_DIGEST}" && break || {
                if [ $i -lt 3 ]; then
                  echo "  ⚠ Retry in 10s ($i/3)..."
                  sleep 10
                else
                  echo "  ❌ Failed to create manifest for $TAG"
                  exit 1
                fi
              }
            done
          done

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "## 🎉 Release 完成" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker 镜像" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**架构**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker pull $REGISTRY/$REPO_OWNER/$IMAGE_NAME:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker pull $DOCKERHUB_REPO:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Phase 7: 发布 Release
  # ==========================================
  publish-release:
    needs: [create-release, upload-assets, merge-docker]
    runs-on: ubuntu-latest

    steps:
      - name: Publish GitHub Release
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
          REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --repo "$REPO" --draft=false

  # ==========================================
  # Phase 8: 清理临时镜像
  # ==========================================
  cleanup-docker:
    needs: publish-release
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true

    steps:
      - name: Delete temporary build images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ env.IMAGE_NAME }}
          RUN_ID: ${{ github.run_id }}
        run: |
          LIST_URLS=(
            "https://api.github.com/users/$GH_OWNER/packages/container/$PACKAGE/versions"
            "https://api.github.com/orgs/$GH_OWNER/packages/container/$PACKAGE/versions"
          )
          for LIST_URL in "${LIST_URLS[@]}"; do
            VERSION_IDS=$(gh api "$LIST_URL" --paginate \
              --jq '.[] | select(.metadata.container.tags[]? | startswith("build-'"$RUN_ID"'")) | .id' 2>/dev/null) || continue
            for ID in $VERSION_IDS; do
              gh api --method DELETE "${LIST_URL%/versions}/versions/$ID" 2>/dev/null || true
            done
          done
        continue-on-error: true

  # ==========================================
  # Phase 9: 安全扫描
  # ==========================================
  security-scan:
    needs: publish-release
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "trivy-results.sarif"
