# ===================================
# API Monitor Unified CI/CD Pipeline
# ===================================
# 触发条件：
# - 推送到 dev 分支（main 由正式 Release 流水线负责）
# - 提 PR 到 main / dev 分支
# - 手动触发
#
# 功能：
# - 阶段 0 (Detect)：检测 agent / relay 是否变更（仅 dev 分支推送启用）。
#   未变更时跳过三平台编译，直接复用滚动 release（built-agents，固定 tag）
#   里的最近产物；有变更时执行完整编译并把新产物 --clobber 覆盖回滚动 release。
#   PR / 手动触发 / 其它分支一律走完整全流程（与既有行为一致），正式发布由
#   release.yml 全量编译、不受影响。
# - 阶段 1 (CI)：前端 ESLint 检查、测试、构建验证
# - 阶段 1 (CI)：前端 ESLint 检查、测试、构建验证
# - 阶段 2 (Build Agent)：并行编译部署所需的 Linux / Windows Agent（仅变更时）
# - 阶段 2c (Publish)：发布新编译的 agent / relay 到滚动 release 供后续复用
# - 阶段 2d (Fetch)：从滚动 release 取回 agent 三件套，统一产物供镜像构建
# - 阶段 3 (CD - Docker)：多架构 Docker 镜像自动构建与发布
# - 阶段 4 (Merge)：合并多架构 Docker Manifest 并生成相应标签（main -> latest, dev -> dev）
#
# 滚动 tag（built-agents）指向孤儿提交，避免被 release.yml 变更日志的
# git describe --tags 命中而污染 changelog。

name: CI/CD Pipeline

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker 镜像自定义标签（可选）"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  security-events: write

env:
  IMAGE_NAME: api-monitor
  REGISTRY: ghcr.io
  DOCKERHUB_REPO: ${{ github.repository_owner }}/api-monitor

jobs:
  # ==========================================
  # 阶段 1: 前端项目 CI 校验
  # ==========================================
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Disable pnpm enforcement
        run: echo "npm_config_user_agent=pnpm/9.0.0 npm/? node/?" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Three-side governance check
        run: npm run governance:check

      - name: Install drawio assets
        run: npm run drawio:install

      - name: Resolve frontend version
        id: fe-version
        run: echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build Frontend Validation
        run: npm run build
        env:
          VITE_USE_CDN: false
          VITE_APP_VERSION: ${{ steps.fe-version.outputs.version }}

      - name: Check build output
        run: |
          ls -la dist/
          test -f dist/index.html
          test -d dist/vendor/drawio

      # 供 build-docker 复用，避免两个平台各自重跑 npm ci / drawio / vite build
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ==========================================
  # 阶段 1.5: Go 后端 CI 校验
  # ==========================================
  ci-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Go from backend-go/go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Run Go Tests
        working-directory: backend-go
        # -p 1 串行运行各包：避免多个包的后台 goroutine（预热/采集循环）
        # 在 Linux 上并发持有 TempDir 文件句柄，导致 t.TempDir 清理报
        # "directory not empty" 的偶发失败（与产品代码正确性无关）。
        # 该环境性 flake 无法根治于单次运行：失败自动重跑一次，
        # 连续两次失败才中断（真失败不会被掩盖）。
        run: |
          go test ./... -v -p 1 -coverprofile=coverage.out || {
            echo "::warning::go test first attempt failed (likely environment flake); retrying once"
            go test ./... -v -p 1 -coverprofile=coverage.out
          }

      - name: Build Go Backend
        working-directory: backend-go
        run: |
          go build -v -o api-monitor ./cmd/api-monitor
          ls -lh api-monitor
          test -x api-monitor

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        continue-on-error: true
        with:
          files: backend-go/coverage.out
          flags: backend-go
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # 阶段 0: 仅 dev 分支推送时检测 agent / relay 是否有变更
  # 未变更 → 跳过三平台编译，直接复用滚动 release 产物；
  # 有变更或非 dev 事件（PR / 手动 / 其它分支）→ 走完整全流程。
  # ==========================================
  detect-agent-changes:
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.flags.outputs.agent_changed }}
      relay_changed: ${{ steps.flags.outputs.relay_changed }}
      binaries_changed: ${{ steps.flags.outputs.binaries_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Detect changes (dev push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        id: changed
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ github.event.before || github.event.pull_request.base.sha || github.sha }}
          filters: |
            agent:
              - 'agent-rust/**'
            relay:
              - 'backend-go/cmd/api-monitor-relay/**'

      - name: Resolve flags
        id: flags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            AGENT="${{ steps.changed.outputs.agent }}"
            RELAY="${{ steps.changed.outputs.relay }}"
            # 若仓库还没有滚动 release 且本次又无二进制变更，强制全流程以完成首次发布
            if [ "${AGENT}" != "true" ] && [ "${RELAY}" != "true" ]; then
              if ! gh release view built-agents --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "Rolling release built-agents not found; forcing full agent build to bootstrap."
                AGENT="true"
              fi
            fi
          else
            AGENT="true"
            RELAY="true"
          fi
          echo "agent_changed=${AGENT:-false}" >> "$GITHUB_OUTPUT"
          echo "relay_changed=${RELAY:-false}" >> "$GITHUB_OUTPUT"
          if [ "${AGENT:-false}" = "true" ] || [ "${RELAY:-false}" = "true" ]; then
            echo "binaries_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "binaries_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ==========================================
  # 阶段 2: 编译部署所需的 Rust Agent (3 平台)
  # ==========================================
  build-agent:
    needs: [detect-agent-changes]
    if: needs.detect-agent-changes.outputs.agent_changed == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            output_name: agent-linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            output_name: agent-linux-arm64
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            output_name: agent-windows-amd64.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache-workspaces: agent-rust

      - name: Install musl-tools (Linux)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \( -iname '*microsoft*' -o -iname '*azure*' \) -delete
          sudo sed -i.bak '/packages\.microsoft\.com/d' /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (ARM64 Linux, qemu cross)
        if: matrix.use_cross
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --force cross

      - name: Remove cargo mirror config in CI
        shell: bash
        run: rm -f agent-rust/.cargo/config.toml

      - name: Run Agent Tests
        working-directory: agent-rust
        shell: bash
        run: cargo test

      - name: Build Agent
        working-directory: agent-rust
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi

      - name: Copy & Rename Binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent.exe dist/${{ matrix.output_name }}
          else
            cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent dist/${{ matrix.output_name }}
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          else
            (cd dist && shasum -a 256 "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          fi
          ls -lh dist/

      - name: Upload agent artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.sha256
          retention-days: 1

  # ==========================================
  # 阶段 2b: 编译 api-monitor-relay（Go，三平台交叉编译，仅 relay 变更时）
  # ==========================================
  build-relay:
    needs: [detect-agent-changes]
    if: needs.detect-agent-changes.outputs.relay_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: api-monitor-relay-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: api-monitor-relay-linux-arm64
          - goos: windows
            goarch: amd64
            output_name: api-monitor-relay-windows-amd64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Go from backend-go/go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Build Relay
        working-directory: backend-go
        shell: bash
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -o dist/${{ matrix.output_name }} ./cmd/api-monitor-relay
          (cd dist && sha256sum "${{ matrix.output_name }}" | awk '{print $1}' > "${{ matrix.output_name }}.sha256")
          ls -lh dist/

      - name: Upload relay artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.output_name }}
          path: |
            dist/${{ matrix.output_name }}
            dist/${{ matrix.output_name }}.sha256
          retention-days: 1

  # ==========================================
  # 阶段 2c: 全流程时把新编译 agent / relay 覆盖到滚动 release（built-agents）
  # 下载链接（固定 tag）稳定不变，供后续无变更推送直接复用。
  # 滚动 tag 挂在孤儿提交上，避免被 release.yml 变更日志的 git describe 命中。
  # ==========================================
  publish-agents:
    needs: [detect-agent-changes, build-agent, build-relay]
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      needs.detect-agent-changes.outputs.binaries_changed == 'true' &&
      needs.build-agent.result != 'failure' &&
      needs.build-relay.result != 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: built-agents
    steps:
      - name: Download compiled agent binaries (本轮构建)
        if: needs.detect-agent-changes.outputs.agent_changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: agent-assets
          pattern: agent-*
          merge-multiple: true

      - name: Download compiled relay binaries (本轮构建)
        if: needs.detect-agent-changes.outputs.relay_changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: relay-assets
          pattern: api-monitor-relay-*
          merge-multiple: true

      - name: Publish assets to rolling release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cp -f agent-assets/* assets/ 2>/dev/null || true
          cp -f relay-assets/* assets/ 2>/dev/null || true
          if ! ls assets/* >/dev/null 2>&1; then
            echo "nothing to publish"; exit 0
          fi

          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 首次：创建孤儿提交承载滚动 tag（空树、无父提交，落在 dev/main 历史之外，
            # git describe 从 HEAD 不可达，release.yml 变更日志不会命中它）
            TMP="$(mktemp -d)"
            git -C "$TMP" init -q
            git -C "$TMP" config user.name "github-actions"
            git -C "$TMP" config user.email "github-actions@users.noreply.github.com"
            ORPHAN=$(git -C "$TMP" commit-tree 4b825dc642cb6eb9a060e54bf8d69288fbee4904 -m "built-agents rolling release")
            git -C "$TMP" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git -C "$TMP" push -q -f origin "$ORPHAN:refs/tags/$RELEASE_TAG"
            # tag 已由上面 push 创建，这里直接绑定 release（不重复传 --target）
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --title "built-agents (rolling agent/relay artifacts)" \
              --notes "CI 持续覆盖的 agent / relay 产物，供 dev 镜像构建复用下载。下载链接稳定。"
          fi

          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" assets/* --clobber
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'

  # ==========================================
  # 阶段 2d: 取回 agent 三件套（本轮构建产物或滚动 release），供镜像构建统一消费
  # ==========================================
  fetch-agents:
    needs: [detect-agent-changes, build-agent]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.build-agent.result != 'failure'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      RELEASE_TAG: built-agents
    steps:
      - name: Download agents from this run
        if: needs.detect-agent-changes.outputs.agent_changed == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: agents
          pattern: agent-*
          merge-multiple: true

      - name: Download agents from rolling release
        if: needs.detect-agent-changes.outputs.agent_changed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agents
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "agent-*" --dir agents
          ls -lh agents/

      - name: Verify agents
        run: |
          ls -lh agents/
          test -f agents/agent-linux-amd64
          test -f agents/agent-linux-arm64
          test -f agents/agent-windows-amd64.exe

      - name: Upload agents bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agents-bundle
          path: agents/
          retention-days: 1

  # ==========================================
  # 阶段 3: 多架构 Docker 镜像分平台构建 (仅 push 触发)
  # ==========================================
  build-docker:
    # Dockerfile builds the frontend and Go backend inside the image. The only
    # upstream artifacts needed here are the prebuilt Agent binaries, so start
    # image builds as soon as Agent bundle is ready and keep CI as a publish gate.
    needs: [fetch-agents, ci-frontend]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      # 💥 核心优化：复用 fetch-agents 准备好的 agent 三件套（本轮或滚动 release），避免镜像内重编
      - name: Download agents bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agents-bundle
          path: agent-rust

      - name: List downloaded agents
        run: ls -lh agent-rust/

      # 复用 ci-frontend 构建的 dist（平台无关），跳过 Docker 内 npm ci / drawio / build
      - name: Download prebuilt frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Verify prebuilt frontend dist
        run: |
          ls -lh frontend-dist/ | head -20
          test -f frontend-dist/index.html
          test -d frontend-dist/vendor/drawio

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve application version
        id: app-version
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VERSION="v$(node -p "require('./package.json').version")"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_REPO }}:build-${{ github.run_id }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=API Monitor
            org.opencontainers.image.description=API聚合监控面板
            org.opencontainers.image.vendor=iwvw
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            maintainer=iwvw
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            NODE_ENV=production
            USE_PREBUILT_AGENT=true
            USE_PREBUILT_FRONTEND=true
            APP_VERSION=${{ steps.app-version.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  # ==========================================
  # 阶段 4: 合并多架构 manifest 并打上分支对应标签 (latest / dev)
  # ==========================================
  merge-docker:
    needs: [ci-frontend, ci-backend, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        shell: bash
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGES=(
            "$REGISTRY/$REPO_OWNER/$IMAGE_NAME"
            "$DOCKERHUB_REPO"
          )
          TAG_NAMES=("${GITHUB_SHA::7}")

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG_NAMES+=("latest")
          elif [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            TAG_NAMES+=("dev")
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$CUSTOM_TAG" ]; then
            TAG_NAMES+=("$CUSTOM_TAG")
          fi

          {
            echo "tags<<EOF"
            for image in "${IMAGES[@]}"; do
              for tag in "${TAG_NAMES[@]}"; do
                echo "$image:$tag"
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)

          echo "AMD64 Digest: $AMD64_DIGEST"
          echo "ARM64 Digest: $ARM64_DIGEST"

          echo "$TAGS" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            if [[ "$TAG" == "$REGISTRY"* ]]; then
               SRC_PREFIX="$REGISTRY/$REPO_OWNER/$IMAGE_NAME"
            else
               SRC_PREFIX="$DOCKERHUB_REPO"
            fi

            echo "🔗 Creating manifest: $TAG"
            for i in {1..3}; do
              docker buildx imagetools create -t "$TAG" \
                "${SRC_PREFIX}@${AMD64_DIGEST}" \
                "${SRC_PREFIX}@${ARM64_DIGEST}" && break || {
                if [ $i -lt 3 ]; then
                  echo "  ⚠ Retry in 10s ($i/3)..."
                  sleep 10
                else
                  echo "  ❌ Failed to create manifest for $TAG"
                  exit 1
                fi
              }
            done
          done

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "## 🐳 Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**标签：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**架构**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # 阶段 5: 清理临时镜像
  # ==========================================
  cleanup-docker:
    needs: merge-docker
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    steps:
      - name: Delete temporary build images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ env.IMAGE_NAME }}
          RUN_ID: ${{ github.run_id }}
        run: |
          LIST_URLS=(
            "https://api.github.com/users/$GH_OWNER/packages/container/$PACKAGE/versions"
            "https://api.github.com/orgs/$GH_OWNER/packages/container/$PACKAGE/versions"
          )
          for LIST_URL in "${LIST_URLS[@]}"; do
            VERSION_IDS=$(gh api "$LIST_URL" --paginate \
              --jq '.[] | select(.metadata.container.tags[]? | startswith("build-'"$RUN_ID"'")) | .id' 2>/dev/null) || continue
            for ID in $VERSION_IDS; do
              gh api --method DELETE "${LIST_URL%/versions}/versions/$ID" 2>/dev/null || true
            done
          done
        continue-on-error: true

  # ==========================================
  # 阶段 6: 安全扫描
  # ==========================================
  security-scan:
    needs: merge-docker
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Select image tag to scan
        id: scan-tag
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.scan-tag.outputs.tag }}
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "trivy-results.sarif"
