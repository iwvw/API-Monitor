# ===================================
# API Monitor Unified CI/CD Pipeline
# ===================================
# 触发条件：
# - 推送到 dev 分支（main 由正式 Release 流水线负责）
# - 提 PR 到 main / dev 分支
# - 手动触发
#
# 功能:
# - 阶段 1 (CI):前端 ESLint/测试/构建 + Go 测试(按包分 2 片并行)与编译校验
# - 阶段 2 (CD - Docker):多架构镜像构建与发布。Agent 二进制不再打进镜像,
#   由 .github/workflows/agent-release.yml 单独构建并发布到本仓库 release;
#   镜像只注入 AGENT_DOWNLOAD_URL 下载基址。
# - 阶段 3 (Merge):合并多架构 Manifest 并打分支标签(main -> latest, dev -> dev)
# - 阶段 4 (Scan/Cleanup):Trivy 扫描与临时镜像清理

name: CI/CD Pipeline

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker 镜像自定义标签（可选）"
        required: false
        default: ""

permissions:
  contents: write
  packages: write
  security-events: write

env:
  IMAGE_NAME: api-monitor
  REGISTRY: ghcr.io
  DOCKERHUB_REPO: ${{ github.repository_owner }}/api-monitor

jobs:
  # ==========================================
  # 阶段 1: 前端项目 CI 校验
  # ==========================================
  ci-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20.x
          cache: "npm"

      - name: Disable pnpm enforcement
        run: echo "npm_config_user_agent=pnpm/9.0.0 npm/? node/?" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # SimpleIcons 字体子集化依赖 fontTools。没有它时
      # tools/generate-simple-icons-css.mjs 会在 CI 严格模式下直接失败 —— 这正是
      # 想要的行为：历史上缺这个依赖导致子集化静默退回 800KB 全量字体，
      # 谁都没发现。apt 版只有 Python 模块（无 pyftsubset 命令），脚本已兼容。
      - name: Install font subset tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-fonttools python3-brotli

      - name: Run ESLint
        run: npm run lint

      - name: Run Tests
        run: npm run test

      - name: Three-side governance check
        run: npm run governance:check
        env:
          # 本次 push 前的提交（PR 用 base sha）：agent-version-governance 需要它
          # 才能判断「agent 二进制输入变了但版本没 bump」。fetch-depth: 0 已保证可达。
          AGENT_VERSION_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}

      - name: Install drawio assets
        run: npm run drawio:install

      - name: Resolve frontend version
        id: fe-version
        run: echo "version=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build Frontend Validation
        run: npm run build
        env:
          VITE_USE_CDN: false
          VITE_APP_VERSION: ${{ steps.fe-version.outputs.version }}

      - name: Check build output
        run: |
          ls -la dist/
          test -f dist/index.html
          test -d dist/vendor/drawio

      # 供 build-docker 复用，避免两个平台各自重跑 npm ci / drawio / vite build
      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ==========================================
  # 阶段 1.5: Go 后端 CI 校验
  # ==========================================
  ci-backend:
    runs-on: ubuntu-latest
    # 测试按包轮转分 6 片并行:整套 go test 串行跑要 7-8 分钟,是镜像构建提速后
    # 新的最长环节(merge-docker 要等它)。每片仍用 -p 1,避免并发包在 Linux 上
    # 撞 t.TempDir 句柄的偶发失败。公开仓库 Actions 分钟数免费,多分片不增加成本。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Setup Go from backend-go/go.mod
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.0.0
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      - name: Run Go Tests (shard ${{ matrix.shard }}/6)
        working-directory: backend-go
        # -p 1 串行运行各包：避免多个包的后台 goroutine（预热/采集循环）
        # 在 Linux 上并发持有 TempDir 文件句柄，导致 t.TempDir 清理报
        # "directory not empty" 的偶发失败（与产品代码正确性无关）。
        # 该环境性 flake 无法根治于单次运行：失败自动重跑一次，
        # 连续两次失败才中断（真失败不会被掩盖）。
        # -v 已去掉:全量 verbose 日志量很大且拖慢上传,失败用例仍会照常打印。
        run: |
          SHARDS=6   # 必须与上面 matrix.shard 的长度一致
          mapfile -t PKGS < <(go list ./... | awk -v s=${{ matrix.shard }} -v n=$SHARDS 'NR % n == (s - 1)')
          echo "shard ${{ matrix.shard }}/$SHARDS: ${#PKGS[@]} packages"
          go test -p 1 -coverprofile=coverage.out "${PKGS[@]}" || {
            echo "::warning::go test first attempt failed (likely environment flake); retrying once"
            go test -p 1 -coverprofile=coverage.out "${PKGS[@]}"
          }
      - name: Build Go Backend
        if: matrix.shard == 1
        working-directory: backend-go
        run: |
          go build -v -o api-monitor ./cmd/api-monitor
          ls -lh api-monitor
          test -x api-monitor

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        continue-on-error: true
        with:
          files: backend-go/coverage.out
          flags: backend-go
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==========================================
  # ==========================================
  # 阶段 2: 编译 Go 后端二进制(每架构一个,镜像直接复用)
  # ==========================================
  # 放在镜像构建之外并行跑:前者只做 checkout + 编译 + 上传,后者不必再等
  # go mod download / go build。编译环境与 Dockerfile 的 go-builder 完全一致
  # (同一 golang:1.27.4-alpine3.24 + gcc/musl-dev),避免产物行为漂移。
  build-go-binary:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Build backend binary (musl, CGO on)
        run: |
          docker run --rm -v "$PWD:/src" -w /src/backend-go \
            -e CGO_ENABLED=1 -e GOOS=linux -e GOARCH=${{ matrix.arch }} \
            golang:1.27.4-alpine3.24 sh -c '
              apk add --no-cache gcc musl-dev >/dev/null &&
              go build -trimpath -ldflags="-s -w" -o api-monitor ./cmd/api-monitor &&
              ls -lh api-monitor
            '

      - name: Upload backend artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-monitor-${{ matrix.arch }}
          path: backend-go/api-monitor
          retention-days: 1



  # ==========================================
  # 阶段 2: 多架构 Docker 镜像分平台构建 (仅 push 触发)
  # ==========================================
  build-docker:
    # Agent 二进制已从镜像剥离:由 .github/workflows/agent-release.yml 单独构建并
    # 发布到本仓库 release(public,可匿名直链),这里只注入下载基址(AGENT_DOWNLOAD_URL),
    # 主机安装与自升级都走该 release 的匿名直链(.sha256 校验)。
    needs: [ci-frontend, build-go-binary]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.ci-frontend.result != 'failure' &&
      needs.build-go-binary.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Download prebuilt frontend dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: frontend-dist

      # 复用 build-go-binary 编好的 musl 二进制,镜像内不再编译 Go
      - name: Download prebuilt backend binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-monitor-${{ matrix.suffix }}
          path: backend-go

      - name: Verify prebuilt backend binary
        run: |
          # upload-artifact 不保留可执行位,下载回来是 0644,必须补 chmod,
          # 否则镜像里 ENTRYPOINT 无法执行。
          chmod +x backend-go/api-monitor
          ls -l backend-go/api-monitor
          test -x backend-go/api-monitor

      - name: Verify prebuilt frontend dist
        run: |
          ls -lh frontend-dist/ | head -20
          test -f frontend-dist/index.html
          test -d frontend-dist/vendor/drawio

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve application version
        id: app-version
        shell: bash
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            VERSION="v$(node -p "require('./package.json').version")"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_REPO }}:build-${{ github.run_id }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=API Monitor
            org.opencontainers.image.description=API聚合监控面板
            org.opencontainers.image.vendor=iwvw
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            maintainer=iwvw
          cache-from: type=gha,scope=${{ matrix.platform }}
          # mode=min:只导出最终镜像层。mode=max 会连中间 stage 一起导出,
          # 实测 export 阶段要 ~99s,而本镜像的中间层几乎每轮都因源码变化失效。
          cache-to: type=gha,mode=min,ignore-error=true,scope=${{ matrix.platform }}
          build-args: |
            NODE_ENV=production
            USE_PREBUILT_BACKEND=true
            INCLUDE_AGENTS=false
            AGENT_DOWNLOAD_URL=https://github.com/iwvw/API-Monitor/releases/download/built-agents
            USE_PREBUILT_FRONTEND=true
            APP_VERSION=${{ steps.app-version.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  # ==========================================
  # 阶段 4: 合并多架构 manifest 并打上分支对应标签 (latest / dev)
  # ==========================================
  merge-docker:
    needs: [ci-frontend, ci-backend, build-docker]
    # build-docker 在 agent 未变更复用路径下同样依赖 always() 放行，merge 必须
    # 显式 always() + needs 全 success 判定，否则会被级联跳过、manifest 不合并。
    if: >-
      always() &&
      needs.ci-frontend.result == 'success' &&
      needs.ci-backend.result == 'success' &&
      needs.build-docker.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        shell: bash
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGES=(
            "$REGISTRY/$REPO_OWNER/$IMAGE_NAME"
            "$DOCKERHUB_REPO"
          )
          TAG_NAMES=("${GITHUB_SHA::7}")

          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG_NAMES+=("latest")
          elif [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            TAG_NAMES+=("dev")
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ -n "$CUSTOM_TAG" ]; then
            TAG_NAMES+=("$CUSTOM_TAG")
          fi

          {
            echo "tags<<EOF"
            for image in "${IMAGES[@]}"; do
              for tag in "${TAG_NAMES[@]}"; do
                echo "$image:$tag"
              done
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create and push manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)

          echo "AMD64 Digest: $AMD64_DIGEST"
          echo "ARM64 Digest: $ARM64_DIGEST"

          echo "$TAGS" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            if [[ "$TAG" == "$REGISTRY"* ]]; then
               SRC_PREFIX="$REGISTRY/$REPO_OWNER/$IMAGE_NAME"
            else
               SRC_PREFIX="$DOCKERHUB_REPO"
            fi

            echo "🔗 Creating manifest: $TAG"
            for i in {1..3}; do
              docker buildx imagetools create -t "$TAG" \
                "${SRC_PREFIX}@${AMD64_DIGEST}" \
                "${SRC_PREFIX}@${ARM64_DIGEST}" && break || {
                if [ $i -lt 3 ]; then
                  echo "  ⚠ Retry in 10s ($i/3)..."
                  sleep 10
                else
                  echo "  ❌ Failed to create manifest for $TAG"
                  exit 1
                fi
              }
            done
          done

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "## 🐳 Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**标签：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$TAGS" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**架构**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # 阶段 5: 清理临时镜像
  # ==========================================
  cleanup-docker:
    needs: merge-docker
    runs-on: ubuntu-latest
    if: always()
    continue-on-error: true
    steps:
      - name: Delete temporary build images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ env.IMAGE_NAME }}
          RUN_ID: ${{ github.run_id }}
        run: |
          LIST_URLS=(
            "https://api.github.com/users/$GH_OWNER/packages/container/$PACKAGE/versions"
            "https://api.github.com/orgs/$GH_OWNER/packages/container/$PACKAGE/versions"
          )
          for LIST_URL in "${LIST_URLS[@]}"; do
            VERSION_IDS=$(gh api "$LIST_URL" --paginate \
              --jq '.[] | select(.metadata.container.tags[]? | startswith("build-'"$RUN_ID"'")) | .id' 2>/dev/null) || continue
            for ID in $VERSION_IDS; do
              gh api --method DELETE "${LIST_URL%/versions}/versions/$ID" 2>/dev/null || true
            done
          done
        continue-on-error: true

  # ==========================================
  # 阶段 6: 安全扫描
  # ==========================================
  security-scan:
    needs: merge-docker
    # merge-docker 在复用路径下是 always() 放行的"条件性 success"，不会自动
    # 放行下游；必须显式 always() + needs 判定，否则 dev 镜像不会被扫描。
    if: >-
      always() &&
      needs.merge-docker.result == 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Select image tag to scan
        id: scan-tag
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.tag }}" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "image"
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.scan-tag.outputs.tag }}
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: "trivy-results.sarif"
