# ===================================
# API Monitor Rust Agent CI
# ===================================
# 触发条件：
# - 推送到 main 分支（agent-rust 目录有变更）
# - PR 中 agent-rust 有变更
# - 手动触发
#
# 功能：
# - 验证 Agent 在所有目标平台上可以编译
# - 上传构建产物供测试
#
# 注意：发版构建由 release.yml 统一处理

name: Build Rust Agent (CI)

on:
  push:
    branches: [main]
    paths:
      - "agent-rust/**"
      - ".github/workflows/agent-build.yml"
  pull_request:
    paths:
      - "agent-rust/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            output_name: agent-linux-amd64
            use_cross: false
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            output_name: agent-linux-arm64
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            output_name: agent-windows-amd64.exe
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            output_name: agent-darwin-amd64
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            output_name: agent-darwin-arm64
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          cache: false
          cache-workspaces: agent-rust

      - name: Install musl-tools (Linux amd64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross (ARM64 Linux)
        if: matrix.use_cross
        shell: bash
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm --force cross

      - name: Remove cargo mirror config in CI
        shell: bash
        run: rm -f agent-rust/.cargo/config.toml

      - name: Build Agent
        working-directory: agent-rust
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --target ${{ matrix.target }} --release
          else
            cargo build --target ${{ matrix.target }} --release
          fi

      - name: Copy & Rename Binary
        shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent.exe dist/${{ matrix.output_name }}
          else
            cp agent-rust/target/${{ matrix.target }}/release/api-monitor-agent dist/${{ matrix.output_name }}
          fi
          ls -lh dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output_name }}
          path: dist/${{ matrix.output_name }}
          retention-days: 7

  summary:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Build Summary
        run: |
          echo "## ✅ Rust Agent CI 构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 平台 | 架构 | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | amd64 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Linux | arm64 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Windows | amd64 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | amd64 | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| macOS | arm64 | ✅ |" >> $GITHUB_STEP_SUMMARY
