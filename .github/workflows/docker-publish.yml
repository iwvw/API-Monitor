# ===================================
# API Monitor Docker 镜像构建（主分支）
# ===================================
# 触发条件：
# - 推送到 main 分支
# - 手动触发
#
# 功能：
# - 构建多架构 Docker 镜像（amd64 + arm64）
# - 推送到 GHCR 和 Docker Hub
# - 使用最新 Release 的 Agent 二进制
#
# 注意：版本发布的 Docker 构建由 release.yml 处理

name: Build Docker Image (Latest)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像标签（可选）"
        required: false
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: api-monitor
  REGISTRY: ghcr.io
  DOCKERHUB_REPO: ${{ github.repository_owner }}/api-monitor

jobs:
  # ==========================================
  # 阶段 1: 分架构构建
  # ==========================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download agent binaries from latest Release
        shell: bash
        run: |
          VERSION=$(grep '^version' agent-rust/Cargo.toml | head -n1 | cut -d'"' -f2)
          echo "📥 Downloading agent binaries (target: v${VERSION}, fallback: latest)..."
          mkdir -p agent-rust

          for file in agent-linux-amd64 agent-linux-arm64 agent-windows-amd64.exe; do
            VERSIONED_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${file}"
            LATEST_URL="https://github.com/${{ github.repository }}/releases/latest/download/${file}"

            if curl -fsSL -o "agent-rust/${file}" "$VERSIONED_URL"; then
              echo "  ✅ ${file} (v${VERSION})"
            elif curl -fsSL -o "agent-rust/${file}" "$LATEST_URL"; then
              echo "  ✅ ${file} (latest fallback)"
            else
              echo "  ⚠ ${file} not available, creating placeholder"
              touch "agent-rust/${file}"
            fi
          done
          ls -lh agent-rust/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}
          labels: |
            org.opencontainers.image.title=API Monitor
            org.opencontainers.image.description=API聚合监控面板
            org.opencontainers.image.vendor=iwvw
            maintainer=iwvw

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          no-cache: true
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:build-${{ github.run_id }}-${{ matrix.suffix }}
            ${{ env.DOCKERHUB_REPO }}:build-${{ github.run_id }}-${{ matrix.suffix }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            NODE_ENV=production

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > /tmp/digests/${{ matrix.suffix }}

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1

  # ==========================================
  # 阶段 2: 合并多架构 manifest
  # ==========================================
  merge:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        continue-on-error: true
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '' && github.event.inputs.tag != 'latest' }}

      - name: Create and push manifest
        run: |
          AMD64_DIGEST=$(cat /tmp/digests/amd64)
          ARM64_DIGEST=$(cat /tmp/digests/arm64)

          echo "AMD64 Digest: $AMD64_DIGEST"
          echo "ARM64 Digest: $ARM64_DIGEST"

          TAGS="${{ steps.meta.outputs.tags }}"
          echo "$TAGS" | while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue

            if [[ "$TAG" == "${{ env.REGISTRY }}"* ]]; then
               SRC_PREFIX="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}"
            else
               SRC_PREFIX="${{ env.DOCKERHUB_REPO }}"
            fi

            echo "🔗 Creating manifest: $TAG"
            for i in {1..3}; do
              docker buildx imagetools create -t "$TAG" \
                "${SRC_PREFIX}@${AMD64_DIGEST}" \
                "${SRC_PREFIX}@${ARM64_DIGEST}" && break || {
                if [ $i -lt 3 ]; then
                  echo "  ⚠ Retry in 10s ($i/3)..."
                  sleep 10
                else
                  echo "  ❌ Failed to create manifest for $TAG"
                  exit 1
                fi
              }
            done
          done

      - name: Summary
        run: |
          echo "## 🐳 Docker 镜像构建成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**标签：**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**架构**: linux/amd64, linux/arm64" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # 阶段 3: 清理临时镜像
  # ==========================================
  cleanup:
    runs-on: ubuntu-latest
    needs: merge
    if: always()
    continue-on-error: true

    steps:
      - name: Delete temporary build images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: false
          ignore-versions: "^(?!build-${{ github.run_id }}).*$"
        continue-on-error: true
