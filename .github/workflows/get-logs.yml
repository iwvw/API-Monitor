name: Get Fail Logs
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Job Logs and Write to File
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Fetching logs for run 26870041400 ===" > logs.txt
          
          JOBS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/iwvw/API-Monitor/actions/runs/26870041400/jobs)
          FAILED_JOBS_IDS=$(echo "$JOBS" | jq -r '.jobs[] | select(.conclusion=="failure") | .id')
          
          for JOB_ID in $FAILED_JOBS_IDS; do
            JOB_NAME=$(echo "$JOBS" | jq -r ".jobs[] | select(.id==$JOB_ID) | .name")
            echo "========================================" >> logs.txt
            echo "Logs for Job: $JOB_NAME ($JOB_ID)" >> logs.txt
            echo "========================================" >> logs.txt
            curl -s -L -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/iwvw/API-Monitor/actions/jobs/$JOB_ID/logs | tail -n 80 >> logs.txt
            echo "" >> logs.txt
          done

      - name: Commit and Push Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add logs.txt
          git commit -m "ci: save build logs [skip ci]" || exit 0
          git push
