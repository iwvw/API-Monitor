<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>API Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="shortcut icon" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <meta name="theme-color" content="Canvas" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <script>
    (function () {
      var themeMode = 'auto';
      var isDark = false;

      try {
        var savedMode = localStorage.getItem('app_theme_mode');
        var legacyTheme = localStorage.getItem('app_theme');
        themeMode = savedMode || legacyTheme || 'auto';
        isDark =
          themeMode === 'dark' ||
          (themeMode !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) {
        isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      document.documentElement.classList.toggle('dark', isDark);
      document.documentElement.classList.toggle('light', !isDark);
      document.documentElement.dataset.mode = isDark ? 'dark' : 'light';
      document.documentElement.dataset.theme = 'kumo';
      document.documentElement.dataset.themeMode = themeMode;
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    })();
  </script>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
      background: var(--app-loading-bg);
      color: var(--app-loading-fg);
    }

    html {
      --app-loading-bg: #f8f7f4;
      --app-loading-fg: #171512;
      --app-loading-track: rgba(220, 125, 64, 0.18);
      --app-loading-accent: #dc7d40;
    }

    html[data-mode='dark'] {
      --app-loading-bg: #050505;
      --app-loading-fg: #f8f7f4;
      --app-loading-track: rgba(220, 125, 64, 0.22);
    }
  </style>
</head>

<body ontouchstart="">
  <div id="app-loading" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s ease-out;
        background: var(--app-loading-bg);
      ">
    <img src="/logo.svg" alt="Loading..." style="
          width: 64px;
          height: 64px;
          margin-bottom: 40px;
          animation: pulse 2s infinite ease-in-out;
        " />
    <div id="loading-progress-track"
      style="width: 160px; height: 5px; border-radius: 999px; overflow: hidden; background: var(--app-loading-track)">
      <div id="loading-progress-bar" style="
            width: 30%;
            height: 100%;
            border-radius: 999px;
            background: var(--app-loading-accent);
            animation: progress-indeterminate 1.5s infinite ease-in-out;
          "></div>
    </div>
    <style>
      @keyframes pulse {
        0% {
          opacity: 0.6;
          transform: scale(0.95);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }

        100% {
          opacity: 0.6;
          transform: scale(0.95);
        }
      }

      @keyframes progress-indeterminate {
        0% {
          transform: translateX(-150%);
        }

        50% {
          transform: translateX(180%);
        }

        100% {
          transform: translateX(400%);
        }
      }
    </style>
    <script>
      (function () {
        var themeMode = document.documentElement.dataset.themeMode || 'auto';
        var isDark = document.documentElement.dataset.mode === 'dark';
        var loader = document.getElementById('app-loading');

        function applyTheme(dark) {
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
          document.documentElement.dataset.mode = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = 'kumo';
          document.documentElement.dataset.themeMode = themeMode;
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          if (loader) {
            loader.style.background = 'var(--app-loading-bg)';
          }
        }

        applyTheme(isDark);

        if (window.matchMedia) {
          window
            .matchMedia('(prefers-color-scheme: dark)')
            .addEventListener('change', function (e) {
              if (themeMode === 'auto') {
                applyTheme(e.matches);
              }
            });
        }
      })();
    </script>
  </div>

  <div id="root"></div>

  <div id="ssh-terminal-warehouse"
    style="visibility:hidden!important;position:absolute!important;left:-9999px!important;top:-9999px!important;width:100px;height:100px;overflow:hidden;pointer-events:none">
  </div>

  <script>
    (function () {
      var fallbackShown = false;

      function showBootFallback(reason) {
        if (fallbackShown || window.__API_MONITOR_BOOTED) {
          return;
        }
        fallbackShown = true;
        var loader = document.getElementById('app-loading');
        if (!loader) {
          return;
        }
        loader.style.opacity = '1';
        loader.style.display = 'flex';
        var detail = String(reason || '应用未能在预期时间内完成挂载').replace(/[&<>"']/g, function (char) {
          return {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[char];
        });
        loader.innerHTML = [
          '<div style="width:min(420px,calc(100vw - 32px));border:1px solid rgba(120,113,108,.25);border-radius:8px;background:var(--app-loading-bg);box-shadow:0 20px 50px rgba(0,0,0,.14);padding:18px;text-align:left">',
          '<div style="font-size:13px;font-weight:800;color:var(--app-loading-fg);margin-bottom:8px">页面启动失败</div>',
          '<div style="font-size:12px;line-height:1.7;color:rgba(120,113,108,.95);margin-bottom:14px">前端资源可能已更新或浏览器仍在使用旧缓存。请重新加载页面，必要时清理缓存后再试。</div>',
          '<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;color:rgba(120,113,108,.9);background:rgba(120,113,108,.08);border-radius:6px;padding:8px;margin-bottom:14px;word-break:break-all">',
          detail,
          '</div>',
          '<button type="button" id="app-reload-button" style="height:32px;border:0;border-radius:6px;background:#dc7d40;color:white;font-size:12px;font-weight:700;padding:0 12px;cursor:pointer">重新加载</button>',
          '</div>',
        ].join('');
        var button = document.getElementById('app-reload-button');
        if (button) {
          button.addEventListener('click', function () {
            var url = new URL(window.location.href);
            url.searchParams.set('_reload', String(Date.now()));
            window.location.replace(url.toString());
          });
        }
      }

      window.__API_MONITOR_SHOW_BOOT_ERROR = showBootFallback;

      window.addEventListener(
        'error',
        function (event) {
          var target = event.target;
          var source = target && (target.src || target.href);
          if (!source) {
            return;
          }
          if (String(source).indexOf('/assets/') !== -1 || String(source).indexOf('/js/main.jsx') !== -1) {
            showBootFallback('资源加载失败：' + source);
          }
        },
        true
      );

      window.addEventListener('unhandledrejection', function (event) {
        var message = event.reason && (event.reason.message || String(event.reason));
        if (/chunk|import|module|failed|loading/i.test(message || '')) {
          showBootFallback(message);
        }
      });

      window.setTimeout(function () {
        var root = document.getElementById('root');
        if (!window.__API_MONITOR_BOOTED && (!root || !root.childElementCount)) {
          showBootFallback('应用未能在 10 秒内完成挂载');
        }
      }, 10000);
    })();
  </script>
  <script async src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="/js/main.jsx"></script>
</body>

</html>
