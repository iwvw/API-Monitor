<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>API Monitor</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="shortcut icon" href="/logo.svg" />
  <link rel="apple-touch-icon" href="/logo.svg" />
  <meta name="theme-color" content="Canvas" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      margin: 0;
    }
  </style>
</head>

<body ontouchstart="">
  <div id="app-loading" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 0.3s ease-out;
        background: var(--color-kumo-canvas, Canvas);
      ">
    <img src="/logo.svg" alt="Loading..." style="
          width: 64px;
          height: 64px;
          margin-bottom: 40px;
          animation: pulse 2s infinite ease-in-out;
        " />
    <div id="loading-progress-track" style="width: 160px; height: 5px; border-radius: 999px; overflow: hidden">
      <div id="loading-progress-bar" style="
            width: 30%;
            height: 100%;
            border-radius: 999px;
            animation: progress-indeterminate 1.5s infinite ease-in-out;
          "></div>
    </div>
    <style>
      @keyframes pulse {
        0% {
          opacity: 0.6;
          transform: scale(0.95);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }

        100% {
          opacity: 0.6;
          transform: scale(0.95);
        }
      }

      @keyframes progress-indeterminate {
        0% {
          transform: translateX(-150%);
        }

        50% {
          transform: translateX(180%);
        }

        100% {
          transform: translateX(400%);
        }
      }
    </style>
    <script>
      (function () {
        var savedMode = localStorage.getItem('app_theme_mode');
        var legacyTheme = localStorage.getItem('app_theme');
        var themeMode = savedMode || legacyTheme || 'auto';
        var isDark =
          themeMode === 'dark' ||
          (themeMode !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var loader = document.getElementById('app-loading');
        var track = document.getElementById('loading-progress-track');
        var bar = document.getElementById('loading-progress-bar');
        var logoAccent = '#dc7d40';

        function applyTheme(dark) {
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.classList.toggle('light', !dark);
          document.documentElement.dataset.mode = dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themeMode = themeMode;
          if (loader) {
            loader.style.background = 'var(--color-kumo-canvas, Canvas)';
          }
          if (track) {
            track.style.background = 'color-mix(in oklch, ' + logoAccent + ' 16%, transparent)';
          }
          if (bar) {
            bar.style.background = logoAccent;
          }
        }

        applyTheme(isDark);

        if (window.matchMedia) {
          window
            .matchMedia('(prefers-color-scheme: dark)')
            .addEventListener('change', function (e) {
              if (themeMode === 'auto') {
                applyTheme(e.matches);
              }
            });
        }
      })();
    </script>
  </div>

  <div id="root"></div>

  <div id="ssh-terminal-warehouse"
    style="visibility:hidden!important;position:absolute!important;left:-9999px!important;top:-9999px!important;width:100px;height:100px;overflow:hidden;pointer-events:none">
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script type="module" src="/js/main.jsx"></script>
</body>

</html>
