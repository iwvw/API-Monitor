# 本地开发用 compose 片段（与 /opt/1panel/docker/compose/api-monitor/docker-compose.yml 等价，
# 只把 image 换成本机编译产物）。用法：
#
#   cd /opt/code/API-Monitor
#   ./tools/local-image.sh                 # 编译并打 iwvw/api-monitor:local
#   docker compose -f docker-compose.local.yml up -d
#
# 与正式 compose 的差异只有 image、container_name 与端口保持隔离，避免和线上容器打架。
services:
  api-monitor:
    image: iwvw/api-monitor:local
    container_name: api-monitor-local
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    environment:
      - APP_ENV=development
      - SECURE_COOKIES=false
      - API_MONITOR_MEMORY_GUARD=false
      - API_MONITOR_AGENT_FILE_ROOTS=/opt/1panel
      - TRUSTED_PROXY_CIDRS=172.19.0.0/16
      - CORS_ALLOWED_ORIGINS=http://localhost:5174,http://tauri.localhost,tauri://localhost,https://occ.dmuk.org
    restart: unless-stopped
