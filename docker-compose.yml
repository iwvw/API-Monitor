services:
  api-monitor:
    image: iwvw/api-monitor:latest
    # image: iwvw/api-monitor:dev # 开发版本可选
    container_name: api-monitor
    restart: unless-stopped
    ports:
      # 默认只绑定回环地址:公网入口应由前置 nginx/openresty 在 443 上终止 TLS 后
      # 反代到 127.0.0.1:3000。直接把 3000 映射到公网会让登录口令与会话 Cookie
      # 全程明文,并绕过前置代理上的 HSTS/CSP/限流。
      # 确需局域网直连时显式设置 API_MONITOR_BIND_ADDR=0.0.0.0(不推荐公网)。
      - "${API_MONITOR_BIND_ADDR:-127.0.0.1}:3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - APP_ENV=${APP_ENV:-production}
      - PORT=3000
      - DATA_DIR=/app/data
      - DB_NAME=data.db
      - LOG_LEVEL=INFO
      - SECURE_COOKIES=${SECURE_COOKIES:-true}
      - ALLOW_LOCAL_SHELL_TASKS=${ALLOW_LOCAL_SHELL_TASKS:-false}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your environment}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your environment}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY in your environment}
