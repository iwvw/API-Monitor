services:
  api-monitor:
    image: iwvw/api-monitor:latest
    # image: iwvw/api-monitor:dev # 开发版本可选
    container_name: api-monitor
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - PORT=3000
      - DATA_DIR=/app/data
      - DB_NAME=data.db
      - LOG_LEVEL=INFO
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your environment}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in your environment}
