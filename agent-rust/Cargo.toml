[package]
name = "api-monitor-agent"
version = "0.6.1"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sysinfo = { version = "0.31" }
bollard = { version = "0.16" }
portable-pty = { version = "0.9" }
clap = { version = "4.5", features = ["derive"] }
base64 = { version = "0.22" }
nvml-wrapper = { version = "0.10.0", optional = true }
futures-util = { version = "0.3" }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false }
webpki-roots = "0.26"
url = { version = "2.5" }
chrono = { version = "0.4", features = ["serde"] }
hostname = { version = "0.4" }
prost = "0.13"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
bytes = "1.10"
tokio-util = { version = "0.7", features = ["io"] }
if-addrs = "0.13"

[target.'cfg(target_os = "windows")'.dependencies]
bytes = "1.10"
enigo = { version = "0.6.1", default-features = false, features = ["platform_specific"] }
rand = "0.8"
rtp = "0.17.2"
webrtc = "0.17.2"
win-native-media = { version = "0.1.1", path = "vendor/win-native-media-0.1.1" }
nvenc = { version = "0.1.0", path = "vendor/nvenc-0.1.0" }
windows = { version = "0.62", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_Input_Pointer",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
] }

[features]
default = ["nvidia"]
nvidia = ["dep:nvml-wrapper"]
