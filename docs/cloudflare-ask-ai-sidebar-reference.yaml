# ============================================================================
# Cloudflare Dashboard 「Ask AI」侧栏 结构调研报告（复刻参考）
# 抓取时间：2026-08-14 | 视口 1330x960 | 登录态 Web 面板
# 官方技术栈：React + @cloudflare/kumo 组件库 + Tailwind CSS
# 颜色体系：Kumo design token（oklch），暗色模式用 dark: 前缀
# ============================================================================

# ----------------------------------------------------------------------------
# 0. 颜色 token 实测值（亮色模式）
# ----------------------------------------------------------------------------
color_tokens:
  kumo-canvas:    "oklch(0.9875 0 0)"            # 页面/侧栏背景 ≈ #FCFCFC
  kumo-overlay:   "oklch(0.9875 0 0)"            # 侧栏/header 背景（同 canvas）
  kumo-fill:      "oklch(0.922 0 0)"             # 用户气泡背景 ≈ #EBEBEB
  kumo-base:      "rgb(255,255,255)"             # 助手气泡/卡片背景（白色）
  kumo-default:   "rgb(49,49,49)"                # 正文文本色 = #313131
  kumo-subtle:    "oklch(0.708 0 0)"             # 次要文本/禁用 ≈ #A3A3A3
  kumo-line:      "oklch(0.145 0 0 / ~10%)"      # 边框/分割线（低透明黑）
  kumo-control:   "oklch(0.95 0 0)"              # 输入框底色
  kumo-elevated:  "oklch(0.95 0 0)"              # 建议卡悬停底色
  kumo-tint:      "oklch(0.92 0 0)"              # 按钮 hover 底色
  hover_accent:   "orange-400/200"               # 建议卡 hover 橙色描边 (#fb923c)
  font_family:    '"Inter Variable", ui-sans-serif, system-ui, sans-serif'

# ----------------------------------------------------------------------------
# 1. 侧栏整体结构（sidebar shell）
# ----------------------------------------------------------------------------
sidebar:
  ref: "html > body > div.fixed.right-0"          # body 下第 7 个 fixed 容器
  tagName: div
  class: "fixed right-0 flex flex-col border-l border-kumo-line bg-kumo-overlay transition-[width,transform] duration-300 ease-in-out dark:bg-kumo-base max-md:!w-screen"
  position: fixed                      # 浮层，不压缩主内容（无 margin 挤压）
  right: "0"
  left: "auto"
  width: "450px"                       # 桌面固定 450px
  height: "100vh" (960px)              # 全视口高
  z_index: 1150
  border_left: "1px kumo-line"         # 左侧分隔线
  transition: "width 0.3s, transform 0.3s cubic-bezier(0.4,0,0.2,1)"
  closed_state: "transform: translateX(100%)"   # 关闭 = 移出右侧屏幕，DOM 保留
  backdrop: 无                           # 打开时无遮罩！主内容可交互
  open_by: "页面 header 右上角「Ask AI」按钮（88x32, h-8, sparkle 图标）"
  close_by:
    - "header 内 Close sidebar 按钮 (aria-label, X 图标)"
    - "Esc 键（实测有效）"
    - "点击外部不关闭（无遮罩）"
  resize_handle:                        # 左侧边缘拖拽手柄，可调宽度
    ref: div.absolute.inset-y-0.-left-1
    class: "absolute inset-y-0 -left-1 z-20 w-2 cursor-col-resize"
    size: "8px 宽 x 960px 高"
  responsive:
    md_breakpoint: 768px
    below_768: "max-md:!w-screen → 全屏覆盖（实测 640px 视口下容器 640px 全宽）"
    above_768: "固定 450px 右侧浮层"
  children:
    - "div.h-screen.sticky.top-0 (flex flex-col w-full overflow-hidden) [449x960]"
      # 注意：内部容器宽 449px（450 - 1px border）

# ----------------------------------------------------------------------------
# 2. 顶部栏（header）58px
# ----------------------------------------------------------------------------
header:
  ref: "div.fixed.right-0 > div.h-screen.sticky > div:nth-of-type(1) > div.flex.items-center"
  tagName: div
  class: "flex items-center justify-between border-b border-kumo-line px-4 h-[58px] bg-kumo-overlay dark:bg-kumo-base"
  size: "449 x 58px"
  border_bottom: "1px kumo-line"
  children:
    left_zone:
      - conversations_dropdown:
          tagName: button
          class: "group w-max shrink-0 font-medium select-none border-0 ... h-9 rounded-lg px-3 ... max-w-[200px] -ml-2"
          text: "新对话"                 # 当前会话标题
          aria: 'aria-haspopup="menu"（DropdownMenu.Trigger）'
          icon: chevron-down（12px svg）
          role: 会话切换下拉（Base UI DropdownMenu）
    right_zone: "flex items-center gap-0.5（三按钮 28x28，h-[7] w-[7] = 28px）"
      - new_conversation:
          aria-label: "New conversation"
          icon: plus（14px svg, Phosphor path）
          class: "...size-6.5 ...!h-7 !w-7 hover:bg-kumo-tint rounded-md p-0"
      - expand_sidebar:
          aria-label: "Expand sidebar"
          icon: expand 对角箭头（14px svg）
          行为: 切换到全屏模式（见 sidebar.expanded_mode）
      - close_sidebar:
          aria-label: "Close sidebar"
          icon: X（14px svg）
          行为: 关闭侧栏

# ----------------------------------------------------------------------------
# 2b. 全屏扩展模式（Expand sidebar 点击后）
# ----------------------------------------------------------------------------
expanded_mode:
  overlay:
    class: "fixed inset-0 flex flex-col w-full bg-neutral-800 z-50 p-2"
    size: "全屏 1330x960，bg-neutral-800 半透明暗色遮罩"
  card:
    class: "w-full h-full bg-bg-secondary rounded-2xl flex relative overflow-hidden"
    radius: "2xl (16px)"
  layout: "内容居中 max-w-4xl mx-auto；footer sticky 底部"
  textarea_size: "816x58（vs 侧栏 417x58）"
  header_extra_buttons:
    - "Toggle Sidebar"
    - "Toggle Artifacts"
    - "Collapse to sidebar"            # 收回到 450px 侧栏
  esc: "实测无效（需点 Collapse to sidebar）"

# ----------------------------------------------------------------------------
# 3. 内容区（body）消息列表
# ----------------------------------------------------------------------------
body:
  ref: "div.fixed.right-0 > div.h-screen.sticky > div.flex-1.flex:nth-of-type(2)"
  class: "flex-1 flex flex-col gap-2 p-4 overflow-y-hidden overflow-x-visible relative"
  size: "449 x 902px（header 之下）"
  background: "bg-kumo-overlay + InteractiveDotGrid"
  dot_grid:                           # 点阵装饰背景
    class: "absolute inset-0 pointer-events-none"
    css: "background-image: radial-gradient(circle, rgba(125,125,125,0.1) 1px, transparent 1px); background-size: 12px 12px"
    highlight: "radial-gradient(60px at 15px 6px, rgba(251,146,60,0.7), ...) + mask-image 同尺寸点阵，随鼠标移动（opacity 动画）"

  message_list:
    scroll_container: "flex h-full flex-1 flex-col overflow-y-auto overscroll-contain（自动滚动，新消息贴底）"
    item_container:
      - user_message:
          ref: article
          class: "flex w-full flex-col gap-2 animate-in fade-in-0 duration-300"
          inner: "div.group.flex.w-full.flex-col.gap-1.items-end"   # 右对齐
          bubble:
            class: "shadow-xs ring-kumo-line overflow-visible rounded-xl px-4 py-3 w-fit !leading-relaxed max-w-prose ml-auto bg-kumo-fill ring-0 !shadow-none"
            bg: "oklch(0.922 0 0)"      # kumo-fill 浅灰
            radius: "12px"
            padding: "12px 16px"
            font: "14px/22.75px"
            max_width: "max-w-prose (65ch)"
      - assistant_message:
          ref: article
          class: "flex w-full flex-col gap-2"
          inner: "div.group.flex.w-full.flex-col.gap-1.items-start"  # 左对齐
          agent_tag:                   # "代理"模型标签
            text: "代理"
            position: 回复块上方
          reasoning_block:             # 思维链（默认展开）
            wrapper: "mb-2 flex flex-col gap-0.5"
            toggle_button:
              text: "Hide reasoning / See reasoning"
              class: "flex items-center gap-1 rounded-sm text-[12px] text-neutral-400 transition-colors hover:text-neutral-500"
              bg: "rgb(240,240,240)" / 透明（两种形态）
              icon: chevron
            body:
              class: "whitespace-pre-wrap break-words"
              font: "14px / 22.75px color #313131"
          thinking_block:               # 工具执行进度（默认折叠）
            toggle_button:
              text: "See thinking / Hide thinking"
              class: "flex items-center gap-1 text-[12px] text-neutral-400 hover:text-neutral-500"
            steps:                      # 展开后的步骤行
              - "→ getSkillContent"
              - "→ Searching API endpoints..."
              - "→ Running Look up zone `dsuk.top` to get its zone ID..."
              - "→ Running Create TXT record for `dsuk.top` with content......"
          reply_bubble:
            class: "shadow-xs ring ring-kumo-line overflow-visible rounded-xl px-4 py-3 bg-kumo-base max-w-full"
            bg: "rgb(255,255,255)"      # 白色
            radius: "12px"
            padding: "12px 16px"
            font: "14px / 22.75px"
            html_content:               # markdown 渲染
              - "inline code: <code> 标签"
              - "链接: <a>（蓝色下划线）"
          feedback_buttons: "3 个 26x26 无文字图标按钮（复制 / 点赞 / 点踩）"

  empty_state:                        # 无消息时的初始视图
    cloud_animation:
      class: "cloud-container relative aspect-square（150px）"
      css: "--node-*-y/scale CSS 变量驱动浮云动画，多层 blur 阴影"
    headline: "h3 text-lg font-medium — Good evening."
    subtitle: "p text-sm text-kumo-subtle — What are we doing today?"
    suggested_prompts:                # 建议提示卡（type=submit，点击直接发送）
      count: 5
      item_class: "group relative flex items-center gap-3 w-full text-left cursor-pointer rounded-xl p-2 border border-kumo-line/50 bg-kumo-elevated"
      size: "288x50，w-full max-w-2xs"
      hover: "hover:border-orange-200 + 左侧橙色渐变竖条(2px) + 阴影 glow"
      icon_box: "w-8 h-8 rounded-lg bg-neutral-100/80"
      texts: ["Environment variables/Add or update secrets", "Create an API token/Set up API access", "Encrypted Client Hello/Enable ECH for my zone", "Orange vs Gray Cloud/What is the difference?", "Domain settings/Show my configuration"]
    support_bar:                      # 顶部支持条
      class: "shadow-xs ring ring-kumo-line overflow-visible flex items-center justify-between rounded-xl bg-kumo-overlay p-2 pl-3 dark:bg-kumo-base"
      size: "417x42"
      text: "Need more help?"
      link: "Support（LinkButton 小号）"

# ----------------------------------------------------------------------------
# 4. 输入区（footer）
# ----------------------------------------------------------------------------
footer:
  ref: "div.fixed.right-0 ... div.mt-auto.flex.flex-col.gap-2"
  class: "mt-auto flex flex-col gap-2"
  size: "417 x 169px"

  privacy_notice:                     # 隐私提示条（可关闭）
    class: "shadow-xs ring ring-kumo-line overflow-visible rounded-xl bg-kumo-overlay"
    size: "417x57（p-3 内部）"
    text: "Chats are recorded to improve the service and are processed in accordance with our Privacy Policy."
    close_button: "26x26（aria-label: Close privacy notice）"

  input_form:
    tagName: form（display: contents）
    input_box:
      class: "relative ring-1 bg-kumo-control ring-kumo-line has-[textarea:focus]:ring-kumo-brand/50 rounded-xl"
      size: "417 x 104px"
      textarea:
        tagName: textarea
        class: "border-0 ... h-auto resize-none ... kumo-input-placeholder"
        rows: 2
        size: "417 x 58px（初始），随内容自动增高，max-height 256px"
        padding: "16px 16px 0"
        font: "14px / 21px"
        placeholder: "Type @ to tag a resource or ? for shortcuts"
        multiline: true               # Enter=换行；发送需点 Submit 按钮
    action_row:
      class: "flex items-center gap-1 justify-between p-4 pt-0 cursor-text"
      children:
        - edit_behavior:
            aria-label: "Edit behavior"
            text: "Ask"               # 行为模式切换（Ask/Agent）
            icon: wrench
        - settings:
            aria-label: "Settings"
            icon: sliders
        - submit:
            aria-label: "Submit"
            state_idle: 'disabled（输入前）'  
            state_ready: 可点（输入后）→ 发送
            state_streaming: "变为「Stop」按钮 [active]（停止生成，实测出现）"
            icon: 上传/发送箭头（26x26）

# ----------------------------------------------------------------------------
# 5. 写操作审批 UI（approval card）
# ----------------------------------------------------------------------------
approval_ui:
  trigger: "AI 调用写 API（POST/PUT/PATCH/DELETE）时，工具执行前出现"
  appears_after: "发送后约 16 秒（LLM 计划+工具调用后）"
  stream_status:                      # 等待期间的流状态区
    ref: status
    text: "Waiting..."
    log_title: "Tool execution status"
    log_rows: "→ Running <工具名> ...（同 thinking 步骤样式）"

  plan_card:                          # 审批卡片
    headline: "p：人类可读计划摘要，如 Create TXT record on dsuk.top"
    details: "p：文字中内联 <code> 标签标出参数（dsuk.top / approval-test-2）"
    diff_expander:                    # 「N 处更改」
      button: "3 处更改（aria-expanded 切换）"
      expanded_content: "KV 明细行：content: approval-test-2 / type: TXT / name: dsuk.top"
    action_buttons:                   # 4 个操作按钮（中文文案实测）
      - "允许此对话"                   # 本次会话内所有此操作放行（primary）
      - "仅此次"                       # 单次放行（secondary）
      - "拒绝"                         # 拒绝（danger/neutral）
      - "请求更改"                     # 打开反馈输入
    request_changes_panel:            # 点「请求更改」展开
      textarea_placeholder: "描述需要更改的内容……"
      counter: "0/1,000"              # 字数限制计数
      buttons: ["取消", "发送[disabled]"]
  timing: "审批等待约 5 分钟 TTL（服务端），超时自动 expired；被拒后 AI 收到结果并继续对话"

# ----------------------------------------------------------------------------
# 6. 交互行为速查
# ----------------------------------------------------------------------------
interactions:
  send: "fill 后点 Submit（Enter 只是换行）"
  stop: "流式生成中 Submit 变 Stop 按钮"
  close_sidebar: ["X 按钮", "Esc"]
  expand: "Expand sidebar → 全屏（Esc 无效，需 Collapse to sidebar）"
  resize: "左侧 8px 手柄可拖动宽度"
  auto_scroll: "消息列表 overflow-y-auto，新消息自动滚到底部"
  conversation_switcher: "header 下拉（新对话/历史会话，truncate 到 200px）"
  privacy_notice: "可关闭（×），关闭后 footer 只剩输入框"

# ----------------------------------------------------------------------------
# 7. 与 API-Monitor 现有实现的差距清单（复刻时参考）
# ----------------------------------------------------------------------------
gap_list:
  - "AskAiPanel 现已用 Kumo Sidebar side=right：需核对宽度 450px / z-1150 / 无遮罩 / Esc 关闭"
  - "需补：左侧拖拽调宽手柄（w-2 cursor-col-resize）"
  - "需补：Expand sidebar 全屏模式（inset-0 z-50 + 居中卡片 + Toggle Sidebar/Artifacts）"
  - "需补：交互式点阵背景（InteractiveDotGrid）"
  - "需补：思维链双折叠（reasoning 默认展开 + thinking 工具步骤默认折叠）"
  - "需补：审批卡「N 处更改」展开 + 请求更改输入（0/1000 计数 + 取消/发送）"
  - "气泡配色对齐：用户 bg-kumo-fill / 助手 bg-kumo-base ring-kumo-line"
  - "footer：placeholder 'Type @ to tag a resource or ? for shortcuts'、Send→Stop 形态"
  - "响应式：max-md:!w-screen 全屏覆盖"